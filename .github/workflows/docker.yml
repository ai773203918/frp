  # 任务 2: 构建并推送镜像
  build-and-push:
    # 依赖于 check-and-build 任务的完成
    needs: check-and-build
    # 【删除】这里的 if 条件，因为它不可靠
    # if: needs.check-and-build.outputs.should_build == 'true' 
    runs-on: ubuntu-latest # 运行环境

    # 任务步骤
    steps:
      # 【新增】第一步，检查是否应该继续构建
      # 如果不应该构建，则提前退出这个 job
      - name: 检查是否需要构建
        if: needs.check-and-build.outputs.should_build != 'true'
        run: |
          echo "镜像已存在，无需构建。"
          # 提前退出，标记为成功（绿色），但后续步骤不会执行
          exit 0

      # 步骤 1: 检出上游仓库的源代码
      - name: 检出 fatedier/frp 源代码
        uses: actions/checkout@v4
        with:
          # 指定要检出的仓库是上游仓库
          repository: fatedier/frp
          # 检出特定的 release tag（由上一个 job 传递而来）
          ref: ${{ needs.check-and-build.outputs.latest_tag }}

      # 步骤 2: 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤 3: 登录到 Docker Hub
      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # 从 Secrets 中读取用户名
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # 从 Secrets 中读取访问令牌

      # 步骤 4: 提取元数据（标签和标签）
      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 镜像名称现在是统一的 frp
          images: ${{ secrets.DOCKERHUB_USERNAME }}/frp
          # 定义镜像的标签
          tags: |
            # 标签为最新的 release tag (例如 v0.65.0)
            type=raw,value=${{ needs.check-and-build.outputs.latest_tag }}
            # 添加一个 'latest' 标签
            type=raw,value=latest

      # 步骤 5: 构建并推送 Docker 镜像
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: . # 构建上下文是当前目录
          file: ./Dockerfile # 指定 Dockerfile 路径
          push: true # 推送镜像到仓库
          tags: ${{ steps.meta.outputs.tags }} # 使用上一步生成的标签
          labels: ${{ steps.meta.outputs.labels }} # 使用上一步生成的标签
          # 启用构建缓存，加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max