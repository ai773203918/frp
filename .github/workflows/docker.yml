# 工作流名称
name: 构建 Docker 镜像

# 触发条件
on:
  # 每周一北京时间上午 10 点左右运行一次检查 (UTC 时间凌晨 2 点)
  schedule:
    - cron: '0 2 * * 1'
  # 允许手动触发
  workflow_dispatch:

# 任务定义
jobs:
  # 任务 1: 检查并决定是否构建
  check-and-build:
    runs-on: ubuntu-latest
    # 条件判断：确保只在原始仓库所有者（ai773203918）的仓库中运行
    if: ${{ github.repository_owner == 'ai773203918' }}

    # 定义输出变量，用于传递给下一个任务
    outputs:
      # 将获取到的版本号传递给下一个 job
      latest_tag: ${{ steps.get_release.outputs.tag }}

    # 任务步骤
    steps:
      # 步骤 1: 获取最新的 Release 版本号
      - name: 获取最新的 Release Tag
        id: get_release
        run: |
          echo "正在从 fatedier/frp 获取最新 release..."
          # 使用 GitHub API 获取最新的 release tag
          LATEST_TAG=$(curl -sL https://api.github.com/repos/fatedier/frp/releases/latest | jq -r ".tag_name")
          echo "最新的 release tag 是: $LATEST_TAG"
          # 将 tag 写入到 GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # 步骤 2: 检查 Docker 镜像是否已存在
      - name: 检查 Docker 镜像是否存在
        id: check_image
        run: |
          # 从上一个步骤获取 tag
          TAG="${{ steps.get_release.outputs.tag }}"
          # 使用 skopeo 工具进行检查，需要先安装
          sudo apt-get update
          sudo apt-get install -y skopeo
          
          # 【关键修改】检查触发事件
          # 如果是手动触发，则直接设置 should_build=true，跳过检查
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "手动触发工作流，强制构建。"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            # 否则（定时触发），检查镜像是否存在
            echo "定时触发，检查镜像是否存在..."
            if skopeo inspect docker://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frp:$TAG > /dev/null 2>&1; then
              echo "Docker Hub 上 Tag 为 $TAG 的 frp 镜像已存在。跳过构建。"
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "Docker Hub 上 Tag 为 $TAG 的 frp 镜像不存在。将触发构建。"
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
          fi

  # 任务 2: 构建并推送镜像
  build-and-push:
    needs: check-and-build
    # 只有当 should_build 为 true 时才运行
    if: needs.check-and-build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    # 权限设置，允许写入 GitHub Packages
    permissions:
      contents: read
      packages: write

    steps:
      # 步骤 1: 检出【你自己的】仓库代码，以获取 Dockerfile
      - name: 检出我的仓库代码
        uses: actions/checkout@v4

      # 步骤 2: 下载上游 Release 的【源码】
      - name: 下载上游源码
        run: |
          # 获取版本号
          TAG="${{ needs.check-and-build.outputs.latest_tag }}"
          # 构造正确的源码 tar.gz 下载链接
          DOWNLOAD_URL="https://github.com/fatedier/frp/archive/refs/tags/${TAG}.tar.gz"
          echo "正在从 $DOWNLOAD_URL 下载源码"
          # 创建目录并下载解压
          mkdir -p frp-src
          # --strip-components=1 会自动去掉顶层目录（如 frp-0.65.0/）
          wget -qO- "$DOWNLOAD_URL" | tar -xz -C frp-src --strip-components=1

      # 步骤 3: 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤 4: 登录到 Docker Hub
      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 步骤 5: 登录到 GitHub Container Registry
      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 6: 提取元数据（标签和标签）
      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 指定要推送到的所有镜像仓库
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frp
            ghcr.io/${{ github.repository }}/frp
          tags: |
            type=raw,value=${{ needs.check-and-build.outputs.latest_tag }}
            type=raw,value=latest

      # 步骤 7: 构建并推送 Docker 镜像
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: . # 构建上下文是当前目录（包含 Dockerfile 和 frp-src）
          file: ./Dockerfile # 指定 Dockerfile 路径
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 指定要构建的平台，实现多架构构建
          platforms: linux/amd64, linux/arm64, linux/arm/v7, linux/386
          cache-from: type=gha
          cache-to: type=gha,mode=max