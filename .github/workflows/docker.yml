# 工作流名称
name: 构建 Docker 镜像

# 触发条件
on:
  # 每周一北京时间上午 10 点左右运行一次检查 (UTC 时间凌晨 2 点)
  schedule:
    - cron: '0 2 * * 1'
  # 允许手动触发
  workflow_dispatch:

# 任务定义
jobs:
  # 任务 1: 检查并决定是否构建
  check-and-build:
    runs-on: ubuntu-latest
    # 条件判断：确保只在原始仓库所有者（ai773203918）的仓库中运行
    if: ${{ github.repository_owner == 'ai773203918' }}

    # 定义输出变量，用于传递给下一个任务
    outputs:
      # 将获取到的版本号传递给下一个 job
      latest_tag: ${{ steps.get_release.outputs.tag }}

    # 任务步骤
    steps:
      # 步骤 1: 获取最新的 Release 版本号
      - name: 获取最新的 Release Tag
        id: get_release
        run: |
          echo "正在从 fatedier/frp 获取最新 release..."
          # 使用 GitHub API 获取最新的 release tag
          LATEST_TAG=$(curl -sL https://api.github.com/repos/fatedier/frp/releases/latest | jq -r ".tag_name")
          echo "最新的 release tag 是: $LATEST_TAG"
          # 将 tag 写入到 GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # 步骤 2: 检查 Docker 镜像是否已存在
      - name: 检查 Docker 镜像是否存在
        id: check_image
        run: |
          # 从上一个步骤获取 tag
          TAG="${{ steps.get_release.outputs.tag }}"
          # 使用 skopeo 工具进行检查，需要先安装
          sudo apt-get update
          sudo apt-get install -y skopeo
          
          # 【修改】现在只需要检查一个名为 frp 的镜像
          if skopeo inspect docker://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frp:$TAG > /dev/null 2>&1; then
            echo "Tag 为 $TAG 的 frp 镜像已存在。跳过构建。"
            # 设置输出变量，告知后续任务无需构建
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Tag 为 $TAG 的 frp 镜像不存在。将触发构建。"
            # 设置输出变量，告知后续任务需要构建
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # 任务 2: 构建并推送镜像
  build-and-push:
    needs: check-and-build
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 检出【你自己的】仓库代码，以获取 Dockerfile
      - name: Checkout my repository
        uses: actions/checkout@v4

      # 步骤 2: 下载上游 Release 的源码
      - name: Download upstream source code
        run: |
          # 获取版本号
          TAG="${{ needs.check-and-build.outputs.latest_tag }}"
          # 构造下载链接
          DOWNLOAD_URL="https://github.com/fatedier/frp/releases/download/${TAG}/frp_${TAG#v}_linux_amd64.tar.gz"
          echo "Downloading source from $DOWNLOAD_URL"
          # 创建目录并下载
          mkdir -p frp-src
          wget -qO- "$DOWNLOAD_URL" | tar -xz -C frp-src --strip-components=1

      # 步骤 3: 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤 4: 登录到 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 步骤 5: 提取元数据（标签和标签）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/frp
          tags: |
            type=raw,value=${{ needs.check-and-build.outputs.latest_tag }}
            type=raw,value=latest

      # 步骤 6: 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # 构建上下文是当前目录（包含 Dockerfile 和 frp-src）
          file: ./Dockerfile # 指定 Dockerfile 路径
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max